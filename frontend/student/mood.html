<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MindBridge – Mood</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">🧠 MindBridge</div>
    <a href="index.html">Dashboard</a>
    <a href="chat.html">Chat</a>
    <a class="active" href="mood.html">Mood</a>
    <a href="calendar.html">Calendar</a>
  </aside>

  <main class="main">

    <div class="card">
      <h2>How are you feeling today?</h2>
    </div>

    <div class="grid">
      <div class="card mood-card" onclick="setMood('happy')">😊 Happy</div>
      <div class="card mood-card" onclick="setMood('okay')">🙂 Okay</div>
      <div class="card mood-card" onclick="setMood('low')">😔 Low</div>
      <div class="card mood-card" onclick="setMood('stressed')">🤯 Stressed</div>
    </div>

    <div id="status" class="status-card"></div>

  </main>
</div>

<script src="./script.js"></script>
</body>
</html>
