<!DOCTYPE html>
<html>
<head>
  <title>MindBridge | Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <h2>🧠 MindBridge</h2>

    <nav>
      <a class="active" href="index.html">Dashboard</a>
      <a href="chat.html">AI Support Chat</a>
      <a href="mood.html">Mood History</a>
    </nav>

    <button class="logout" onclick="logout()">Sign Out</button>
  </aside>

  <main class="content">
    <h1 id="greet"></h1>
    <p>How are you feeling right now?</p>

    <div class="card">
      <h3>Daily Check-in</h3>

      <div class="moods">
        <button onclick="logMood('Happy')">😊 Happy</button>
        <button onclick="logMood('Neutral')">😐 Neutral</button>
        <button onclick="logMood('Sad')">😔 Sad</button>
        <button onclick="logMood('Anxious')">😟 Anxious</button>
        <button onclick="logMood('Angry')">😡 Angry</button>
      </div>

      <textarea id="note" placeholder="What's on your mind?"></textarea>
      <button onclick="saveMood()">Log Mood</button>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
