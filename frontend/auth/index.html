<!DOCTYPE html>
<html>
<head>
  <title>MindBridge</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="wrapper">
  <div class="left">
    <img src="../assets/logo.png" class="logo">
    <h1>MindBridge</h1>
    <p>Your safe space for mental wellness. Connect with AI support, track your moods, and find balance in your daily life.</p>
  </div>

  <div class="right">
    <h2>Welcome</h2>
    <p>Sign in to your account or create a new one</p>

    <div class="tabs">
      <button onclick="showLogin()" id="lTab" class="active">Login</button>
      <button onclick="showRegister()" id="rTab">Register</button>
    </div>

    <div id="loginBox">
      <label>Email</label>
      <input id="email">
      <label>Password</label>
      <input type="password" id="password">
      <button onclick="login()">Sign In</button>
    </div>

    <div id="registerBox" class="hidden">
      <input placeholder="Full Name">
      <input placeholder="Email">
      <input placeholder="Password" type="password">
      <select>
        <option>Student</option>
        <option>Counsellor</option>
      </select>
      <button>Create Account</button>
    </div>
  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
