<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="counsellor.css">
<title>MindBridge | Counsellor Dashboard</title>
</head>
<body>

<div class="layout">
<aside>
<h2>🧠 MindBridge</h2>
<div class="nav active">Risk Alerts</div>
<div class="user-info" id="userLabel"></div>
<button onclick="logout()">Sign Out</button>
</aside>

<main>
<h1>Counsellor Dashboard</h1>
<p>Monitor and manage student risk alerts in real-time.</p>

<div class="stats">
<div class="orange">Pending High Risk <h2 id="pendingCount">-</h2></div>
<div class="blue">Total Active Alerts <h2 id="totalCount">-</h2></div>
<div class="green">Resolved Today <h2 id="resolvedCount">-</h2></div>
</div>

<h3>Active Risk Alerts</h3>
<div id="alertsContainer"><p>Loading alerts...</p></div>
</main>
</div>

<script src="counsellor.js"></script>
</body>
</html>
