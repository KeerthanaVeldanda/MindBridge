<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MindBridge – Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">MindBridge</h2>
    <a class="active" href="index.html">Dashboard</a>
    <a href="chat.html">Chat</a>
    <a href="mood.html">Mood</a>
    <a href="calendar.html">Calendar</a>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- GREETING -->
    <div class="card hero">
      <h2>Hello 👋</h2>
      <p class="sub">This is your safe space today</p>
    </div>

    <!-- STATS -->
    <div class="grid">

      <div class="card stat">
        <h4>Today’s Mood</h4>
        <p id="todayMood" class="big">—</p>
      </div>

      <div class="card stat">
        <h4>Weekly Check-ins</h4>
        <p class="big">4 / 7</p>
      </div>

      <div class="card stat">
        <h4>Stress Level</h4>
        <p class="big calm">Low</p>
      </div>

    </div>

    <!-- QUICK ACTIONS -->
    <div class="card">
      <h3>Quick Actions</h3>
      <div class="actions">
        <button onclick="location.href='chat.html'">💬 Talk Now</button>
        <button onclick="location.href='mood.html'">😊 Add Mood</button>
        <button onclick="location.href='calendar.html'">📅 View Calendar</button>
      </div>
    </div>

    <!-- INSIGHTS -->
    <div class="card">
      <h3>Your Insights</h3>
      <ul class="insights">
        <li>✔ You’ve checked in 4 times this week</li>
        <li>✔ Your mood trend is stable</li>
        <li>✔ No high-risk alerts detected</li>
      </ul>
    </div>

  </main>
</div>

<script src="dashboard.js"></script>
</body>
</html>
