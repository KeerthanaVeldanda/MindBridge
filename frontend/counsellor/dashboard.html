<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MindBridge – Counsellor Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">MindBridge</h2>
    <p class="role">Counsellor Panel</p>

    <a class="active">Dashboard</a>
    <a>Risk Alerts</a>
    <a>Students</a>
    <a>Reports</a>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">
      <h1>Risk Monitoring</h1>
      <span class="status">Live</span>
    </header>

    <!-- STATS -->
    <section class="stats">
      <div class="stat-card high">
        <h3>High Risk</h3>
        <p id="highCount">0</p>
      </div>
      <div class="stat-card medium">
        <h3>Medium Risk</h3>
        <p id="mediumCount">0</p>
      </div>
      <div class="stat-card low">
        <h3>Low Risk</h3>
        <p id="lowCount">0</p>
      </div>
    </section>

    <!-- ALERT TABLE -->
    <section class="alerts">
      <h2>Recent Alerts</h2>

      <table>
        <thead>
          <tr>
            <th>Student ID</th>
            <th>Risk Level</th>
            <th>Reason</th>
            <th>Detected At</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="alertTable">
          <!-- Filled by JS -->
        </tbody>
      </table>
    </section>

  </main>
</div>

<script src="dashboard.js"></script>
</body>
</html>
